# gsmini_tasks asset manifest (version 2)
# Paths are relative to gsmini_tasks/assets/. Every file a task needs is listed and shipped inside the package.
# ship: true  -> included in the package; scripts/fetch_assets.py --check verifies size + sha256.
# generate:   -> the file can also be rebuilt locally by a package script (scripts/fetch_assets.py --regenerate).
# upstream:   -> where the third-party file comes from (informational; nothing is downloaded at install time).
# Third-party meshes: license 'see upstream project' = the licence of the origin URL applies to the mesh; annotations belong to this package.
version: 2
paths_relative_to: gsmini_tasks/assets
tasks: [one_leg, square_table, lamp_bulb, drawer_container, gear_mesh, nut_thread, insert_tube, insert_hdmi, lift, handover, cloth_edge_feed, cloth_fold_half, cable_needle_thread, cable_slack_reduce, cable_route_channel, sleeve_pull_on_forearm, dough_target_shape, dough_press_thickness, dough_fill_tray, fem_plug_insert]
sets:
  dough:
    origin: {project: gsmini_tasks (this package), url: null}
    license: same as package
    ship: true
    notes: "Procedural USDs (box handle + box head, UsdPreviewSurface, convexHull colliders) written by scripts/make_dough_assets.py (pxr only); the shipped files are byte-identical to a fresh run of that script."
  furniturebench:
    origin: {project: "FurnitureBench part meshes (square_table, lamp, drawer), converted to binary USD", url: "https://github.com/clvrai/furniture-bench"}
    license: see upstream project
    ship: true
    notes: "Upstream repository is MIT licensed. Binary usdc, no external references; one mesh per part with convex colliders. Annotation/*.json: grasp / insertion poses."
  isaac_factory:
    origin: {project: "NVIDIA Isaac Lab Factory task USDs (Isaac Sim asset library, processed copies)", url: "https://github.com/isaac-sim/IsaacLab"}
    license: see upstream project
    ship: true
    notes: "Processed with pxr from the official Factory USDs (Isaac Sim 5.1 library, Isaac/IsaacLab/Factory/factory_*.usd): PhysicsArticulationRootAPI/root FixedJoint stripped, solverPositionIterationCount 192 / velocity 1 baked, contactOffset 0.005 / restOffset 0 baked, SDF colliders kept; gear_medium and nut_m16 re-origined to body centre (mesh shift). References OmniPBR.mdl (Kit built-in). Annotation/*.json: grasp / insertion poses."
  univtac:
    origin: {project: "UniVTAC benchmark object meshes (insert_tube, insert_HDMI, lift), converted to USD", url: "https://github.com/univtac/UniVTAC"}
    license: see upstream project
    ship: true
    notes: "Upstream repository is Apache-2.0 licensed. Binary usdc, no external references. Annotation/*.json: grasp / insertion poses."
  bottle:
    origin: {project: "bottle_5 mesh of the upstream simulator's object library, re-exported for the X-Trainer grasp", url: null}
    license: see upstream project
    ship: true
    notes: "Binary usdc with Omniverse Kit layer metadata only. Annotation/grasp_pose.json holds grasp poses."
  hdri:
    origin: {project: Poly Haven HDRIs, url: "https://polyhaven.com/hdris"}
    license: CC0 (Poly Haven; see upstream page)
    ship: true
    notes: "4k Radiance .hdr (~25 MB each; 4k variant). Rigid tasks light with noon_grass_4k, soft and dough tasks with photo_studio_01_4k. Lighting randomisation over further Poly Haven HDRIs is optional and not part of the package. The local files were re-saved through an image editor, so the sha256 may differ from the Poly Haven download."
  desk:
    origin: {project: NVIDIA Omniverse SimReady props (appleseed_coffeetable), url: "https://omniverse-content-staging.s3.us-west-2.amazonaws.com/Assets/simready_content/common_assets/props/appleseed_coffeetable/"}
    license: NVIDIA Omniverse asset EULA
    ship: false
    reason: replaced by procedural table
    notes: "Not shipped and not needed: the scene uses a plain table slab (SceneCfg.desk)."
